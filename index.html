<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Rama 🤍</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="aurora aurora-blue"></div>
    <div class="aurora aurora-purple"></div>

    <div id="stars"></div>

    <div class="shooting-star"></div>

    <!-- Mouse Glow -->
    <div class="mouse-glow"></div>


    <!-- Opening Screen -->
    <section class="opening" id="opening">

        <div class="typing-box">

            <div class="avatar">
                🤍
            </div>

            <p id="openingText">
                Diw sedang mengetik...
            </p>

            <div class="typing-dot">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

    </section>



    <!-- Main Content -->
    <main class="container" id="mainContent">


        <section class="card hero-card">

            <h1>
                Untuk Rama 🤍
            </h1>


            <p class="message">
                Ada seseorang yang ingin mengatakan sesuatu
                lewat halaman kecil ini.
            </p>


            <button class="apple-button" id="startButton">
                Buka Pesan ✨
            </button>


        </section>



        <section class="card hidden-message">

            <h2>
                Terima kasih sudah hadir
            </h2>


            <p>
                Mungkin tidak banyak yang bisa diberikan,
                tapi ada seseorang yang selalu berharap
                kamu baik-baik saja.
            </p>


        </section>



        <!-- Sound -->
        <button class="sound-button" id="soundButton">
            🌧️ Hujan OFF
        </button>


        <audio id="rainSound" loop>
            <source src="rain.mp3" type="audio/mpeg">
        </audio>


    </main>



<script src="script.js"></script>

</body>
</html>
